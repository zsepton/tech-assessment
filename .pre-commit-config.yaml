repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: bash -c 'cd backend && .venv/bin/ruff check --fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd backend && .venv/bin/ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: eslint
        name: eslint --fix (frontend)
        entry: bash -c 'cd frontend && node_modules/.bin/eslint --fix .'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: pytest-cov
        name: pytest --cov (backend, 100% required)
        entry: bash -c 'cd backend && .venv/bin/pytest'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: vitest-cov
        name: vitest --coverage (frontend, 100% required)
        entry: bash -c 'cd frontend && npx vitest run --coverage'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
